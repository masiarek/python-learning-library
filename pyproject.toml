[project]
name = "python-learning-library"
version = "0.1.0"
description = "A runnable learning library about Python — one idea per page, every claim backed by a stdlib-only program that runs and is checked against its recorded output in CI."
requires-python = ">=3.11"
dependencies = []

# Not an installable package — just a place to pin the docs toolchain so CI and
# the local preview resolve the exact same versions from uv.lock.
[tool.uv]
package = false

[dependency-groups]
# The MkDocs site build. To change a docs dependency, edit here and run `uv lock`.
# mkdocs-same-dir is pinned exactly: it is the plugin that lets the docs root be
# the repo root, and it is the one most likely to break the whole build silently.
#
# Note what is NOT here: the examples have no dependencies at all. That is the
# central rule of this library — a page about Python must run on the `python3`
# the reader already has, with nothing installed. See CONTRIBUTING.md.
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-same-dir==0.1.3",
]
